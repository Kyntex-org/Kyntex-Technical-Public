<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">Product evidence placeholders</title><desc id="desc">Two labeled placeholders. A current band photograph and a real-device demonstration have not been supplied.</desc><rect x="8" y="8" width="384" height="284" rx="12" fill="#f4f6f9" stroke="#bcc6d3" stroke-dasharray="6 5"/><g text-anchor="middle" font-family="Arial, sans-serif"><text x="200" y="100" fill="#586779" font-size="14" letter-spacing="2">PLACEHOLDER</text><text x="200" y="145" fill="#162236" font-size="21" font-weight="bold">BAND PHOTOGRAPH</text><text x="200" y="181" fill="#586779" font-size="15">Actual current hardware</text><text x="200" y="211" fill="#586779" font-size="15">To be added</text></g><rect x="408" y="8" width="384" height="284" rx="12" fill="#f4f6f9" stroke="#bcc6d3" stroke-dasharray="6 5"/><g text-anchor="middle" font-family="Arial, sans-serif"><text x="600" y="100" fill="#586779" font-size="14" letter-spacing="2">PLACEHOLDER</text><text x="600" y="145" fill="#162236" font-size="21" font-weight="bold">DEVICE VIDEO</text><text x="600" y="181" fill="#586779" font-size="15">Actual band to phone workflow</text><text x="600" y="211" fill="#586779" font-size="15">To be added</text></g></svg>
