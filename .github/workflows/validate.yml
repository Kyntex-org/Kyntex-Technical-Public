name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate JavaScript
        run: npm test
      - name: Build firmware core
        run: cmake -S firmware-core -B build/firmware -DCMAKE_BUILD_TYPE=Release
      - name: Test firmware core
        run: cmake --build build/firmware --config Release && ctest --test-dir build/firmware --output-on-failure
